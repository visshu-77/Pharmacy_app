<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="StoreFlow — billing, inventory and reports for every kind of shop: grocery, hardware, pharmacy, electronics and more."
    />

    <!-- Icons. Modern browsers take the SVG; the .ico covers older ones. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews (WhatsApp, Slack, social) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StoreFlow — Billing & Inventory for Every Shop" />
    <meta
      property="og:description"
      content="Billing, inventory and reports for grocery, hardware, pharmacy, electronics and more."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />

    <!-- Apply the saved theme before first paint so dark mode never flashes. -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>

    <title>StoreFlow — Billing & Inventory for Every Shop</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run StoreFlow.</noscript>
    <div id="root"></div>
  </body>
</html>
